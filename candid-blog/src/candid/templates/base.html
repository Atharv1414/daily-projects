<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Candid{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('blog.index') }}">Candid</a>
  <form action="{{ url_for('blog.index') }}"><input type="search" name="q" aria-label="Search posts" placeholder="Search" value="{{ search or '' }}"></form>
  {% if current_user.is_authenticated %}
    {% if current_user.can_write %}<a href="{{ url_for('blog.new') }}">Write</a>{% endif %}
    {% if current_user.role == Role.ADMIN %}<a href="{{ url_for('auth.users') }}">Users</a>{% endif %}
    <form class="inline" method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Sign out {{ current_user.username }}</button></form>
  {% else %}
    <a href="{{ url_for('auth.login') }}">Sign in</a><a href="{{ url_for('auth.register') }}">Register</a>
  {% endif %}
</nav>
<main>
  {% for message in get_flashed_messages() %}<p class="flash" role="status">{{ message }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
