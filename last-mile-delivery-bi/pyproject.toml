[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "last-mile-delivery-bi"
version = "1.0.0"
description = "BI for a UK parcel carrier: DuckDB star schema with two fact grains, governed KPIs with RAG targets, and an interactive Plotly dashboard with depot drill-downs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharv" }]
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "plotly>=5.20", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
delivery-bi = "last_mile_delivery_bi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=last_mile_delivery_bi --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
