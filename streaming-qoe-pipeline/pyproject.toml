[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-qoe-pipeline"
version = "1.0.0"
description = "Event-time stream processor for video-player telemetry: partitioned log, watermarks, tumbling/hopping/session windows, late-data side output, exactly-once checkpoints into DuckDB and CDN incident alerting"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharv Patil" }]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "pydantic>=2.6", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6.100"]

[project.scripts]
qoe = "streaming_qoe_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
