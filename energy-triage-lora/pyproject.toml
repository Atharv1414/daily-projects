[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-triage-lora"
version = "1.0.0"
description = "A tiny transformer trained from scratch and fine-tuned with LoRA to triage energy-supplier customer messages, against honest baselines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6.100"]
torch = ["torch>=2.3"]

[project.scripts]
energy-triage = "energy_triage_lora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: trains small models (seconds, not minutes)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Customer-message templates read best as one sentence per line.
"src/energy_triage_lora/data.py" = ["E501"]
