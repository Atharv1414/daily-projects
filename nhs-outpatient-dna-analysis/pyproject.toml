[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-outpatient-dna-analysis"
version = "1.0.0"
description = "Why do NHS outpatients miss appointments? Cleaning, an SMS reminder RCT, logistic risk model, forecasting backtest and a costed recommendation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharv Patil" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
                "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6.100"]

[project.scripts]
dna-analysis = "outpatient_dna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
