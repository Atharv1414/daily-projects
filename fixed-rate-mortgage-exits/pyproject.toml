[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-rate-mortgage-exits"
version = "1.0.0"
description = "Who leaves when a fixed-rate mortgage ends? Competing risks with delayed entry, honest backtesting and a costed retention plan"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharv Patil" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6.100"]

[project.scripts]
mortgage-exits = "mortgage_exits.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
