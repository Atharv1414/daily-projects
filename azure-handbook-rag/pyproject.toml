[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-rag"
version = "0.1.0"
description = "Small end-to-end RAG app on Azure AI Search and Azure AI Foundry"
requires-python = ">=3.11"
dependencies = [
  "azure-ai-projects>=2.11,<3",
  "azure-identity>=1.27,<2",
  "azure-search-documents>=12.1,<13",
  "fastapi>=0.115,<1",
  "openai>=3.58,<4",
  "python-dotenv>=1.2,<2",
  "uvicorn>=0.34,<1",
]
[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "httpx2", "requests"]
[project.scripts]
azure-rag = "azure_rag.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
azure_rag = ["*.html"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
