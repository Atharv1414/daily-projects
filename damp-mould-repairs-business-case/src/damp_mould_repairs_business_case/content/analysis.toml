# Analyst-authored content. The tool validates it (traceability, RACI rules, MoSCoW balance)
# and renders it next to the measured results.

[[pain_points]]
id = "PP1"
text = "Written summaries wait in one administrator's queue and are typed by hand."
metric = "met_summary"
[[pain_points]]
id = "PP2"
text = "Make-safe jobs queue behind routine repairs because work is first come, first served."
metric = "met_make_safe"
[[pain_points]]
id = "PP3"
text = "Survey visits fail because nobody is home, then wait days to be rebooked."
metric = "no_access_visits"
[[pain_points]]
id = "PP4"
text = "Every case gets a survey visit and a post inspection, whatever its risk."
metric = "inspections"
[[pain_points]]
id = "PP5"
text = "Nobody can see a statutory clock until it has been missed."
metric = "met_investigate"
[[pain_points]]
id = "PP6"
text = "Triage and inspection records are missing, so compliance cannot be evidenced."
metric = "conformance"

[[stakeholders]]
name = "Tenants and tenant panel"
interest = "high"
influence = "medium"
need = "A safe home, a clear date and no repeated visits"
engage = "Panel reviews letters and booking texts; two co-design sessions"
[[stakeholders]]
name = "Director of Property Services"
interest = "high"
influence = "high"
need = "Compliance at an affordable cost"
engage = "Sponsor; fortnightly steering group"
[[stakeholders]]
name = "Head of Compliance"
interest = "high"
influence = "high"
need = "Evidence that stands up to the Ombudsman and the Regulator"
engage = "Approves clock definitions and the audit trail"
[[stakeholders]]
name = "Surveyors"
interest = "high"
influence = "medium"
need = "Professional judgement respected; fewer wasted journeys"
engage = "Pilot group; set the rules for desk assessment"
[[stakeholders]]
name = "Repairs contractor"
interest = "medium"
influence = "high"
