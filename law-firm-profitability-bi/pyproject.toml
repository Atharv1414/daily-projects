[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "law-firm-profitability-bi"
version = "1.0.0"
description = "Bitemporal BI mart and dashboard API for law-firm profitability: lock-up, realisation waterfall, price-volume-mix and restatement bridges"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharv Patil" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "plotly>=5.20", "matplotlib>=3.8",
    "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6.100", "httpx>=0.27"]

[project.scripts]
law-bi = "law_firm_profitability_bi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
law_firm_profitability_bi = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
