name: tests

on:
  push:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          projects=$(find . -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R . | jq -cs .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build Docker image (if the project has one)
        if: hashFiles(format('{0}/Dockerfile', matrix.project)) != ''
        run: docker build -t "${{ matrix.project }}" .
