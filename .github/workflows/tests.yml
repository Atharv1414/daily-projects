name: tests

on:
  push:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      dotnet: ${{ steps.find.outputs.dotnet }}
      cpp: ${{ steps.find.outputs.cpp }}
      dbt: ${{ steps.find.outputs.dbt }}
      postgres: ${{ steps.find.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # A project is a top-level folder; its language is decided by its build file.
          to_json() { sed 's|^\./||' | sort -u | jq -R . | jq -cs .; }
          python=$(find . -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' | to_json)
          dotnet=$(find . -mindepth 2 -maxdepth 2 \( -name '*.sln' -o -name '*.slnx' \) -printf '%h\n' | to_json)
          cpp=$(find . -mindepth 2 -maxdepth 2 -name CMakeLists.txt -printf '%h\n' | to_json)
          dbt=$(find . -mindepth 2 -maxdepth 2 -name dbt_project.yml -printf '%h\n' | to_json)
          postgres=$(find . -mindepth 3 -maxdepth 3 -type d -path './*/db/migrations' -printf '%h\n' \
            | xargs -r -n1 dirname | to_json)
          echo "projects=$python" >> "$GITHUB_OUTPUT"
          echo "dbt=$dbt" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "Python: $python"; echo "C#: $dotnet"; echo "C++: $cpp"
          echo "SQL (dbt): $dbt"; echo "SQL (PostgreSQL): $postgres"

  test:
    name: python (${{ matrix.project }})
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build Docker image (if the project has one)
        if: hashFiles(format('{0}/Dockerfile', matrix.project)) != ''
        run: docker build -t "${{ matrix.project }}" .

  mysql:
    name: mysql (web-scraping-pipeline)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: harvest
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s
          --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: web-scraping-pipeline
    env:
      HARVEST_MYSQL_URL: mysql://root@127.0.0.1:3306/harvest
      HARVEST_REQUIRE_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  dotnet:
    name: csharp (${{ matrix.project }})
    needs: discover
    if: needs.discover.outputs.dotnet != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.dotnet) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - run: dotnet test --no-build -c Release
      - name: Build Docker image (if the project has one)
        if: hashFiles(format('{0}/Dockerfile', matrix.project)) != ''
        run: docker build -t "${{ matrix.project }}" .

  cpp:
    name: cpp (${{ matrix.project }}, ${{ matrix.compiler }})
    needs: discover
    if: needs.discover.outputs.cpp != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.cpp) }}
        compiler: [gcc, clang]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - run: pipx install clang-format==19.1.7  # pinned so local and CI formatting agree
      - name: Check formatting
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.ipp')
          if [ -n "$files" ]; then clang-format --dry-run --Werror $files; fi
      - name: Configure (Debug + AddressSanitizer/UBSan)
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Build Docker image (if the project has one)
        if: matrix.compiler == 'gcc' && hashFiles(format('{0}/Dockerfile', matrix.project)) != ''
        run: docker build -t "${{ matrix.project }}" .

  dbt:
    name: sql-dbt (${{ matrix.project }})
    needs: discover
    if: needs.discover.outputs.dbt != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.dbt) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: dbt deps --profiles-dir .
        if: hashFiles(format('{0}/packages.yml', matrix.project)) != ''
      - name: Lint SQL (SQLFluff, dbt templater)
        run: sqlfluff lint $(ls -d models tests analyses snapshots 2>/dev/null)
      - name: Build models and run data + unit tests
        run: dbt build --profiles-dir .

  postgres:
    name: sql-postgres (${{ matrix.project }})
    needs: discover
    if: needs.discover.outputs.postgres != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.postgres) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
      - run: pip install -r requirements.txt
      - name: Lint SQL (SQLFluff, postgres dialect)
        run: sqlfluff lint db tests
      - name: Migrate a throwaway database and run SQL tests
        run: ./scripts/test.sh
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
